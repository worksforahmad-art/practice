<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form-blob">
                <img src="assets/images/blob.svg" alt="Form Blob" class="blob-image blob-image--1">
                <img src="assets/images/blob.svg" alt="Form Blob" class="blob-image blob-image--2">
                <img src="assets/images/blob.svg" alt="Form Blob" class="blob-image blob-image--3">
            </div>
        </div>
        <div class="form-header">
            <p>Please enter your details</p>
            <h1>Welcome Back</h1>
        </div>    
        <form class="form-box">
            <div class="input-group">
                <input type="email" class="input-field" placeholder="Email" required>
                <label for="email" class="floating-lable">Email address</label>
            </div>
            <div class="input-group">
                <input type="password" class="input-field" placeholder="Password" required>
                <label for="password" class="floating-lable">Password</label>
                <div class="eye-icon">
                    p
                </div>     
            </div>
            <div class="input-group checkbox group">
                <div class="form-col remember-me">
                    <input type="checkbox" id="remember-me-checkbox" class="checkbox-field">
                    <label for="remember-me-checkbox" class="checkbox-label">Remember me</label>
                </div>
                <div class="form-col">
                    <a href="#" class="form-link">Forgot password?</a>
                </div>
            </div>
                <button type="submit" class="form-btn--submit">Sign In</button>
        </form>
        <div class="form-divider">
            <p> or </p>

        </div>
        <div class="form-bottom">
            <div class="form-socials">
                <button class="form-btn form-btn--social">
                    <img src="assets/images/google.svg" class="btn-icon" alt="social-icon">
                </button>
                <button class="form-btn form-btn--social">
                    <img src="assets/images/facebook.svg" class="btn-icon" alt="social-icon">
                </button>
                <button class="form-btn form-btn--social">
                    <img src="assets/images/apple.svg" class="btn-icon" alt="social-icon">
                </button>
            </div>
            <p> Don't have an account? <a href="#" class="form-link">Sign up</a></p>
        </div>

    </div>
</body>
</html>
